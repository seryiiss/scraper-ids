services:
  - type: web
    name: scraper-ids
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: scraper-db
          property: connectionString
      - key: URL_TEMPLATE
        sync: false # Render te la pedirá al crear el servicio, p. ej. https://web.com/ficha/{id}
      - key: SELECTORS
        value: '{"titulo": "h1", "precio": ".price", "imagen": "img@src"}'
      - key: START_ID
        value: "1"
      - key: END_ID
        value: "1000"
      - key: DELAY_SECONDS
        value: "2"
      - key: MAX_CONSECUTIVE_MISSES
        value: "0"
      - key: AUTO_START
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: scraper-db
    plan: free
